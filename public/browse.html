<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse · OrbitMatch</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/browse.js"></script>
</head>
<body class="app-page">
  <header class="app-bar">
    <div class="bar-left">
      <a class="logo" href="/home.html">OrbitMatch</a>
      <nav class="tabs" aria-label="Sections">
        <a href="/home.html" id="dash-link">Dashboard</a>
        <a href="/browse.html" aria-current="page">Browse</a>
      </nav>
    </div>

    <div class="account" id="account">
      <button class="ask-open" type="button" id="ask-button" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M10.6 2.2c.62 5.9 2.9 8.3 8.4 9.3-5.5 1-7.78 3.4-8.4 9.3-.62-5.9-2.9-8.3-8.4-9.3 5.5-1 7.78-3.4 8.4-9.3Z" fill="currentColor"/>
          <path d="M19.4 14.2c.22 2.05.98 2.88 2.9 3.2-1.92.32-2.68 1.15-2.9 3.2-.22-2.05-.98-2.88-2.9-3.2 1.92-.32 2.68-1.15 2.9-3.2Z" fill="currentColor" opacity=".62"/>
        </svg>
        Ask Cosmo
        <kbd>⌘K</kbd>
      </button>
      <span class="who" id="who"></span>
    </div>
  </header>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1 id="title"></h1>
        <p class="muted" id="sub"></p>
      </div>
      <div class="page-actions">
        <button class="submit compact" type="button" id="action-primary"></button>
      </div>
    </div>

    <!-- Time and orbit are the axes that matter in launch, not geography. -->
    <section class="timeline" aria-labelledby="timeline-title">
      <div class="timeline-head">
        <div>
          <h2 id="timeline-title">Windows</h2>
          <p class="muted" id="timeline-sub"></p>
        </div>
        <button class="quiet-link" type="button" id="clear-cell" hidden>Clear selection</button>
      </div>
      <div class="timeline-grid" id="timeline"></div>
    </section>

    <div class="section-head">
      <h2 id="results-title"></h2>
      <div class="filter">
        <label for="orbit">Orbit</label>
        <select id="orbit"><option value="">All orbits</option></select>
      </div>
    </div>

    <section class="results" id="results" aria-live="polite"></section>

    <p class="prototype-note">Prototype — every row is sample data, and nothing is saved.</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
