<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · OrbitMatch</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/forgot.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="brand brand--wide">
      <svg class="orbits" viewBox="0 0 600 340" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <radialGradient id="halo">
            <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
            <stop offset=".55" stop-color="#22d3ee" stop-opacity=".07"/>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
          </radialGradient>
          <!-- light falls from the upper left, so the planet has a lit limb and a dark side -->
          <radialGradient id="planet" cx="34%" cy="28%" r="78%">
            <stop offset="0" stop-color="#3a4250"/>
            <stop offset=".45" stop-color="#171c24"/>
            <stop offset="1" stop-color="#05070a"/>
          </radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7fe6f7" stop-opacity=".75"/>
            <stop offset=".45" stop-color="#22d3ee" stop-opacity=".12"/>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
          </linearGradient>
          <!-- the near half of the orbit is drawn over the planet, the far half behind it -->
          <clipPath id="near"><rect x="0" y="170" width="600" height="170"/></clipPath>
        </defs>

        <circle cx="300" cy="170" r="150" fill="url(#halo)"/>
        <ellipse cx="300" cy="170" rx="290" ry="30" fill="none" stroke="#fff" stroke-opacity=".07" transform="rotate(6 300 170)"/>
        <ellipse cx="300" cy="170" rx="200" ry="120" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="2 6" transform="rotate(18 300 170)"/>
        <ellipse cx="300" cy="170" rx="260" ry="64" fill="none" stroke="#22d3ee" stroke-opacity=".3" transform="rotate(-12 300 170)"/>

        <circle cx="300" cy="170" r="54" fill="url(#planet)"/>
        <circle cx="300" cy="170" r="54" fill="none" stroke="url(#rim)" stroke-width="1.4"/>

        <g clip-path="url(#near)">
          <ellipse cx="300" cy="170" rx="260" ry="64" fill="none" stroke="#22d3ee" stroke-opacity=".62" transform="rotate(-12 300 170)"/>
        </g>

        <g transform="rotate(-12 300 170)">
          <g class="sat">
            <circle r="9" fill="#22d3ee" fill-opacity=".16"/>
            <circle r="3.5" fill="#67e8f9"/>
          </g>
        </g>

        <circle cx="470" cy="112" r="1.6" fill="#fff" fill-opacity=".6"/>
        <circle cx="132" cy="243" r="1.3" fill="#fff" fill-opacity=".45"/>
      </svg>

      <a class="logo" href="/login.html">OrbitMatch</a>

      <div class="pitch">
        <h1>Locked out?</h1>
        <p>It happens. Tell us the work email you signed up with and we'll get you back in.</p>
      </div>

      <p class="brand-foot">© OrbitMatch</p>
    </aside>

    <main class="panel">
      <div class="form-wrap narrow" id="form-wrap">
        <header class="form-head">
          <h2>Forgot password</h2>
          <p class="muted">We'll send a link to set a new one.</p>
        </header>

        <form id="forgot" novalidate>
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" autofocus aria-describedby="email-error">
            <p class="error" id="email-error" aria-live="polite"></p>
          </div>

          <button class="submit" type="submit">
            <span class="submit-text">Send reset link</span>
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 10h11m-4.5-4.5L15 10l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>

        <p class="alt-action">Remembered it? <a href="/login.html">Back to log in</a></p>
      </div>
    </main>
  </div>
</body>
</html>
